# Generated by contract-gen/build.mjs from openapi.tmpl.yaml and fixtures.mjs; do not edit.
# Peer messaging hub wire contract, protocol 1 (draft); contract.md beside openapi.yaml holds only
# what a schema cannot say.
# Computed example values (signatures, body hashes, derived ids, rendered envelopes) come from a
# throwaway test key; validate-contract.py recomputes and checks every one of them.
openapi: "3.2.0"
info:
  title: amesh peer messaging hub
  version: 1.0.0-draft.2026-11-19-a2
  summary: nanoclaw's /peer API for amesh daemons, the amesh daemon's local socket, and the Claude Code frames they mirror.
  description: |-
    The wire contract of the peer messaging hub (spec.md D28, "contract first"), peer protocol 1.

    - **Hub wire:** the amesh daemon on each machine calls a nanoclaw hub's `/peer` routes over
      a private network (the `hub` servers). Every route except `GET /peer/hello` is signed
      (`peerSignature`); the stream `GET /peer/events` is `text/event-stream` with one
      discriminated item schema over every event kind.
    - **Daemon socket:** sessions on one machine reach the daemon over its Unix socket (the
      `daemon` server, given per path): `amesh mcp` pipes its stdio onto `GET /amesh/mcp`, which
      upgrades to MCP (D32); the hooks post to `POST /amesh/hooks`; `amesh status` reads
      `GET /amesh/status`. The MCP servers the daemon publishes over that pipe are in
      `x-amesh-mcp`.
    - **Native wire:** the frames the daemon writes into and reads from Claude Code's inbox
      sockets are component schemas with no operation, marked `x-amesh-native: true`. They
      mirror undocumented Claude Code 2.1.328 behaviour (s-native.md) and can change with any
      Claude Code update; the daemon's startup check refuses to run on a mismatch (R24).

    The `daemon` server (given on each `/amesh/` path) is HTTP/1.1 over the daemon's Unix socket
    `~/.local/state/amesh/amesh.sock` (directory 0700, socket 0600, `AMESH_STATE_DIR` moves it;
    *proposed*). The host name is ignored, and the daemon closes any connection whose peer uid
    is not its own. Probe it with
    `curl --unix-socket ~/.local/state/amesh/amesh.sock http://amesh.localhost/amesh/status`.

    Examples: `components/examples`, keyed by name. Each carries `x-amesh-schema`, the schema
    it is an instance of; error examples also carry `x-amesh-status`. `validate-contract.py`
    checks every example against its `x-amesh-schema`, and against the schema of every
    operation, parameter and response that references it. Under D28
    nanoclaw's tests produce the hub shapes and amesh's tests decode them, both from this file.

    Readers ignore unknown fields and unknown values of every enum marked `x-amesh-open: true`
    (contract.md section 2); an enum marked `x-amesh-open: false` is closed, so a generated
    decoder may reject an unknown value. The schemas list protocol 1's fields and are not
    closed, except the MCP tool arguments.

    Marking: *proposed* marks a choice beyond the spec (every proposed number is accepted, D42);
    *A1* marks a rule the contract review changed and *A2* one the contract polish changed
    (contract.md section 20).
  x-amesh-status: accepted by the owner with spec.md and plan.md, 2026-11-19 (D30); amended by A1 (the contract review, D44) and A2 (the contract polish), 2026-11-19
servers:
  - name: hub
    url: https://hub.example.com
    description: A nanoclaw hub, reachable only on a private network (R14, spec 4.4). Every route is under /peer.
  - name: hub-local
    url: http://127.0.0.1:3001
    description: a local nanoclaw stack (just local up); prints its own base.
externalDocs:
  description: contract.md, what a schema cannot say
  url: ./contract.md
tags:
  - name: hub
    description: nanoclaw's /peer routes, called by the amesh daemon.
  - name: daemon
    description: the amesh daemon's Unix socket, called by amesh mcp, the hooks and amesh status on the same machine.
security:
  - peerSignature: []

paths:
  /peer/hello:
    get:
      tags: [hub]
      operationId: getHello
      summary: Configuration check, unsigned
      description: For people and probes. Opens nothing.
      security: []
      responses:
        '200':
          description: The protocols and features the hub serves.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HelloInfo'}
              examples:
                helloInfo: {$ref: '#/components/examples/helloInfo'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [hub]
      operationId: postHello
      summary: Open a connection epoch
      description: |-
        Sent at daemon start and before every stream (re)connect. Idempotent for the daemon
        process holding the live epoch (same `instance`: the same epoch back); a new process gets
        a new epoch per the takeover rules (contract.md section 5). Answers the hub's event-log id
        (`log`) and the settings the daemon then validates against the `Settings` bounds. An
        error without an `ErrorBody` (a proxy 502, a hub build without `/peer`, the gate's 403)
        means back off and retry, never a halt.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HelloRequest'}
            examples:
              helloRequest: {$ref: '#/components/examples/helloRequest'}
      responses:
        '200':
          description: The new epoch, settings and limits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HelloResponse'}
              examples:
                helloResponse: {$ref: '#/components/examples/helloResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/HelloConflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /peer/events:
    get:
      tags: [hub]
      operationId: getEvents
      summary: The machine's event stream
      description: |-
        One stream per machine, signed once at connect. Sends one `endpoint` event without an SSE
        id per open endpoint of the machine, then replays the log after `after`, then one
        `status` event per directory entry (the whole directory), then `synchronized`, then live
        events (contract.md section 10). `: ping` comments every `keepaliveMs`. Lines end in LF.
      parameters:
        - name: after
          in: query
          required: true
          description: The daemon's persisted cursor; 0 for a new machine. One past the log head is `400 bad_cursor`.
          schema: {type: integer, minimum: 0, maximum: 9007199254740991}
        - name: epoch
          in: query
          required: true
          description: The live epoch from `POST /peer/hello`. Query order is fixed (after, then epoch) because the target is signed.
          schema: {$ref: '#/components/schemas/Epoch'}
      responses:
        '200':
          description: An SSE stream. Not compressed.
          headers:
            Cache-Control:
              schema: {type: string, const: no-cache}
            X-Accel-Buffering:
              schema: {type: string, const: 'no'}
          content:
            text/event-stream:
              itemSchema: {$ref: '#/components/schemas/EventStreamItem'}
              examples:
                streamReplay: {$ref: '#/components/examples/streamReplay'}
        '400': {$ref: '#/components/responses/StreamBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Superseded'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /peer/peers:
    get:
      tags: [hub]
      operationId: getPeers
      summary: The mesh directory
      description: |-
        Every member of `mesh`: flagged agents and registered, not ended sessions of every
        machine, including the asking machine's own (the daemon leaves those out of
        `list_peers`). The same entries arrive on the stream as `status` events.
      parameters:
        - name: project
          in: query
          required: false
          description: The `@project` filter (D13).
          schema: {$ref: '#/components/schemas/Label'}
        - name: machine
          in: query
          required: false
          description: The `@project:machine` filter; only with `project`, and after it in the query.
          schema: {$ref: '#/components/schemas/MachineName'}
      responses:
        '200':
          description: The directory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PeersResponse'}
              examples:
                peersResponse: {$ref: '#/components/examples/peersResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /peer/sessions/{key}:
    parameters:
      - $ref: '#/components/parameters/SessionKeyPath'
    put:
      tags: [hub]
      operationId: putSession
      summary: Register or update a session
      description: |-
        Idempotent. Sent when a session's mesh pipe connects, and again whenever its registry
        entry changes (`/rename` changes `name`, `/clear` changes `sessionId`; the key stays).
        Registering an ended key revives it and reopens its endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionRegisterRequest'}
            examples:
              sessionRegisterRequest: {$ref: '#/components/examples/sessionRegisterRequest'}
      responses:
        '200':
          description: The session as the hub records it, with its assigned address.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRegisterResponse'}
              examples:
                sessionRegisterResponse: {$ref: '#/components/examples/sessionRegisterResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Superseded'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /peer/heartbeat:
    post:
      tags: [hub]
      operationId: postHeartbeat
      summary: Heartbeat, cursor acknowledgement and complete session list
      description: |-
        Every `heartbeatMs`, and at most once a second when a session's status changes. The
        list is complete: a live key it leaves out is ended (contract.md section 6). The
        `cursor` is the low-water mark (D39) and sets `sent` on every message up to it; any
        delivery report for a message also implies `sent` (section 12).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HeartbeatRequest'}
            examples:
              heartbeatRequest: {$ref: '#/components/examples/heartbeatRequest'}
      responses:
        '200':
          description: Keys to register again and keys the hub ended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HeartbeatResponse'}
              examples:
                heartbeatResponse: {$ref: '#/components/examples/heartbeatResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Superseded'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /peer/sessions/{key}/human:
    parameters:
      - $ref: '#/components/parameters/SessionKeyPath'
    post:
      tags: [hub]
      operationId: postHumanTurn
      summary: The owner typed in this session (D24)
      description: Resets the hop counter of every conversation of the session (contract.md section 9). A second reset is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HumanTurnRequest'}
            examples:
              humanTurnRequest: {$ref: '#/components/examples/humanTurnRequest'}
      responses:
        '200':
          description: How many conversations went to 0.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HumanTurnResponse'}
              examples:
                humanTurnResponse: {$ref: '#/components/examples/humanTurnResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '409': {$ref: '#/components/responses/Superseded'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /peer/sessions/{key}/end:
    parameters:
      - $ref: '#/components/parameters/SessionKeyPath'
    post:
      tags: [hub]
      operationId: postSessionEnd
      summary: End a session
      description: Sent only after the session's outbox is empty (per-session order, L17); until then the session stays in the heartbeat list. Messages still queued for it are dropped with `ended`. A `404 unknown_session` answer means the session is already ended, so the end is done.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionEndRequest'}
            examples:
              sessionEndRequest: {$ref: '#/components/examples/sessionEndRequest'}
      responses:
        '200':
          description: The session is ended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionEndResponse'}
              examples:
                sessionEndResponse: {$ref: '#/components/examples/sessionEndResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '409': {$ref: '#/components/responses/Superseded'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /peer/messages:
    post:
      tags: [hub]
      operationId: postMessage
      summary: Send a message (a conversation start or a native reply)
      description: |-
        One route for a start from `send_message` (`to.address`, D3) and a native reply from a
        relay socket (`to.endpoint`, D18). Idempotent on `(machine, id)`: the same id with the
        same `from.session`, `to` and `text` answers the stored state again, whatever the
        `epoch` and the other fields; a different `from.session`, `to` or `text` is
        `409 id_conflict` (contract.md section 8). The body bytes are never compared.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendRequest'}
            examples:
              sendStartRequest: {$ref: '#/components/examples/sendStartRequest'}
              sendReplyRequest: {$ref: '#/components/examples/sendReplyRequest'}
      responses:
        '200':
          description: Accepted (queued), or the stored state of a replayed id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
              examples:
                sendResponse: {$ref: '#/components/examples/sendResponse'}
                sendResponseOffline: {$ref: '#/components/examples/sendResponseOffline'}
        '400': {$ref: '#/components/responses/SendBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/SendForbidden'}
        '404': {$ref: '#/components/responses/SendNotFound'}
        '409': {$ref: '#/components/responses/SendConflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /peer/reports:
    post:
      tags: [hub]
      operationId: postReports
      summary: Delivery state and idle reports from the receiving daemon
      description: Batched, at most 100 per request (*proposed*). First final state wins; an unknown id answers `applied false` with state `null`, never an error for the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportsRequest'}
            examples:
              reportsRequest: {$ref: '#/components/examples/reportsRequest'}
      responses:
        '200':
          description: One result per report, in order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportsResponse'}
              examples:
                reportsResponse: {$ref: '#/components/examples/reportsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Superseded'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /amesh/mcp:
    servers:
      - name: daemon
        url: http://amesh.localhost
        description: HTTP/1.1 over the daemon's Unix socket ~/.local/state/amesh/amesh.sock (see info).
    get:
      tags: [daemon]
      operationId: upgradeMcp
      summary: Upgrade a pipe connection to MCP (D32, *proposed*)
      description: |-
        `amesh mcp [args]` dials the daemon socket, sends this request with its own argv as
        repeated `arg` parameters, and on `101` copies stdin to the socket and the socket to
        stdout until either side closes. After the `101` the connection carries MCP's stdio
        transport (newline-delimited JSON-RPC 2.0) to the server `x-amesh-mcp` names for the
        arguments: none for the mesh mode, `--parent <id>` for the lane mode, both under the one
        name `amesh` (D33). The daemon identifies
        the session from the connection's kernel peer pid (contract.md section 16) at the
        upgrade and again on every tool call.
      security: []
      parameters:
        - name: arg
          in: query
          required: false
          description: The pipe's argv after `mcp`, one parameter per argument, in order, passed through unparsed.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string, maxLength: 200}
            maxItems: 8
          examples:
            mesh:
              summary: amesh mcp
              dataValue: []
            lane:
              summary: amesh mcp --parent <parent session id>
              dataValue: ['--parent', '4b0f3c2d-1e9a-4c8b-a7d6-5e4f3a2b1c0d']
        - name: reconnect
          in: query
          required: false
          description: |-
            `1` when the pipe re-dials after the connection dropped mid-session (a daemon
            restart). The daemon then initializes the MCP session itself, because Claude Code
            sends `initialize` only once per server process (D35; the Go SDK's support is an M1 build
            check).
          schema: {type: integer, enum: [1], x-amesh-open: false}
        - name: Connection
          in: header
          required: true
          schema: {type: string, const: Upgrade}
        - name: Upgrade
          in: header
          required: true
          schema: {type: string, const: mcp-stdio}
      responses:
        '101':
          description: Switched to MCP stdio framing.
          headers:
            Upgrade:
              required: true
              schema: {type: string, const: mcp-stdio}
        '400':
          description: Unknown or malformed arguments. The pipe prints `message` to stderr and exits 1.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalError'}
              examples:
                localBadRequest: {$ref: '#/components/examples/localBadRequest'}
        '403':
          description: |-
            The caller is not a Claude Code session, or it is a mesh pipe in an excluded
            directory or from a config dir other than the first in `AMESH_CLAUDE_CONFIG_DIRS`. The pipe prints `message` to stderr and exits 1, so the session has no
            amesh tools.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalError'}
              examples:
                localNotInSession: {$ref: '#/components/examples/localNotInSession'}
                localExcluded: {$ref: '#/components/examples/localExcluded'}

  /amesh/hooks:
    servers:
      - name: daemon
        url: http://amesh.localhost
        description: HTTP/1.1 over the daemon's Unix socket ~/.local/state/amesh/amesh.sock (see info).
    post:
      tags: [daemon]
      operationId: postHook
      summary: Claude Code hook input, forwarded by amesh hook (D24, R15, *proposed*)
      description: |-
        `amesh hook` is a pipe like `amesh mcp`: it posts its stdin (the hook input) here,
        prints the response body to stdout on `200` and nothing otherwise, and always exits 0.
        The daemon identifies the session by the kernel peer pid at accept time (the hook's
        parent is the session's `claude`). One endpoint serves both hooks, by
        `hook_event_name`:

        - `UserPromptSubmit` (async hook): a prompt starting with any `NotHumanPromptPrefixes`
          entry, or from a session that is not a mesh member, is `204`; anything else is `202`,
          and the daemon then must confirm it against the transcript (`origin.kind == "human"`
          on that prompt's row; no row by the session's end means no report) before it posts
          `POST /peer/sessions/{key}/human`.
        - `PreToolUse` on `mcp__amesh__.*` (D33, D34): with `agent_id` (a
          subagent) the answer is `200` with the deny; without it `204`.
        - `PreToolUse` on native `SendMessage` (trial in M1): with `agent_id` and a
          `tool_input.to` that is one of the daemon's relay addresses, `200` with the deny;
          otherwise `204`.

        Every hook input's `permission_mode` is kept per session as its real class (R13):
        `bypassPermissions` is `bypass`, anything else `prompting`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HookInput'}
            examples:
              hookPromptHuman: {$ref: '#/components/examples/hookPromptHuman'}
              hookGuardSubagent: {$ref: '#/components/examples/hookGuardSubagent'}
              hookGuardSubagentSendMessage: {$ref: '#/components/examples/hookGuardSubagentSendMessage'}
      responses:
        '200':
          description: Hook output for Claude Code, printed as is.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HookOutputPreToolUse'}
              examples:
                hookGuardDeny: {$ref: '#/components/examples/hookGuardDeny'}
        '202':
          description: A candidate human turn, taken; the report to the hub follows in the background.
        '204':
          description: Nothing to do (not human, not a member, a main-session tool call).
        '400':
          description: Not a hook input this endpoint knows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalError'}
              examples:
                localBadRequest: {$ref: '#/components/examples/localBadRequest'}
        '403':
          description: The caller is not a Claude Code session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalError'}
              examples:
                localNotInSession: {$ref: '#/components/examples/localNotInSession'}

  /amesh/status:
    servers:
      - name: daemon
        url: http://amesh.localhost
        description: HTTP/1.1 over the daemon's Unix socket ~/.local/state/amesh/amesh.sock (see info).
    get:
      tags: [daemon]
      operationId: getStatus
      summary: Daemon status for amesh status (needs no session)
      security: []
      responses:
        '200':
          description: The daemon's state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DaemonStatus'}
              examples:
                status: {$ref: '#/components/examples/status'}
                statusHalted: {$ref: '#/components/examples/statusHalted'}

components:
  securitySchemes:
    peerSignature:
      type: http
      scheme: Amesh-Sig
      description: |-
        Device-auth's signed header under the peer scheme name, with the peer protocol constant
        (contract.md section 4 has the verification order, nonce store and domain separation):

            Authorization: Amesh-Sig v=1,p=1,d=<machineId>,t=<unix seconds>,n=<nonce>,bh=<body sha256 hex>,s=<signature>

        The signature is ECDSA P-256 over SHA-256, DER, base64url without padding, over the
        canonical text: eight lines joined by LF, no trailing newline:

            AMESH-SIG-V1
            <p>
            <METHOD>
            <target: path and query exactly as on the request line>
            <t>
            <n: 16 random bytes, base64url>
            <bh: lowercase hex SHA-256 of the body bytes, of zero bytes for a GET>
            <machineId>

        Vectors: the `sig*` examples (`SignatureVector`) with the throwaway `testKey`.

        Transition: amesh 0.1.5 and older sign as `HeyDan-Sig` over `HEYDAN-SIG-V1`. A hub
        accepts both pairs until every daemon it serves is upgraded, each scheme name with its
        own prefix only, then drops the old pair.

  parameters:
    SessionKeyPath:
      name: key
      in: path
      required: true
      description: The session key (contract.md section 6).
      schema: {$ref: '#/components/schemas/SessionKey'}

  responses:
    BadRequest:
      description: Malformed request (a daemon bug); permanent for that request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errBadRequest: {$ref: '#/components/examples/errBadRequest'}
            errBadBody: {$ref: '#/components/examples/errBadBody'}
    SendBadRequest:
      description: Malformed, or a refusal of this message.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errBadRequest: {$ref: '#/components/examples/errBadRequest'}
            errBadBody: {$ref: '#/components/examples/errBadBody'}
            errEmptyText: {$ref: '#/components/examples/errEmptyText'}
            errSlashCommand: {$ref: '#/components/examples/errSlashCommand'}
            errBadAddress: {$ref: '#/components/examples/errBadAddress'}
    StreamBadRequest:
      description: Malformed, or a cursor ahead of the log.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errBadRequest: {$ref: '#/components/examples/errBadRequest'}
            errBadCursor: {$ref: '#/components/examples/errBadCursor'}
    Unauthorized:
      description: Authentication failed; costs the `peer-auth:<client address>` bucket.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errBadSignature: {$ref: '#/components/examples/errBadSignature'}
            errUnknownMachine: {$ref: '#/components/examples/errUnknownMachine'}
            errStaleTimestamp: {$ref: '#/components/examples/errStaleTimestamp'}
            errReplayed: {$ref: '#/components/examples/errReplayed'}
    Forbidden:
      description: The machine was revoked (R14); the daemon halts.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errMachineRevoked: {$ref: '#/components/examples/errMachineRevoked'}
    SendForbidden:
      description: Revoked, or a refusal of this message.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errMachineRevoked: {$ref: '#/components/examples/errMachineRevoked'}
            errNotMember: {$ref: '#/components/examples/errNotMember'}
            errNotAParty: {$ref: '#/components/examples/errNotAParty'}
    SessionNotFound:
      description: The session key is not registered; the daemon registers it again and retries once, except on `POST /peer/sessions/{key}/end`, where it means done.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errUnknownSession: {$ref: '#/components/examples/errUnknownSession'}
    SendNotFound:
      description: The sender is not registered, or the target is not there.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errNotFound: {$ref: '#/components/examples/errNotFound'}
            errNotRunning: {$ref: '#/components/examples/errNotRunning'}
            errUnknownSession: {$ref: '#/components/examples/errUnknownSession'}
            errUnknownEndpoint: {$ref: '#/components/examples/errUnknownEndpoint'}
    Superseded:
      description: The request carried an older epoch. The daemon sends one fresh `hello`; it halts only if that answers `409 machine_in_use` (another daemon owns the machine).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errSuperseded: {$ref: '#/components/examples/errSuperseded'}
    HelloConflict:
      description: Another daemon holds the live epoch; transient, back off and retry.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errMachineInUse: {$ref: '#/components/examples/errMachineInUse'}
    SendConflict:
      description: Superseded, or a refusal of this message.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errSuperseded: {$ref: '#/components/examples/errSuperseded'}
            errAmbiguous: {$ref: '#/components/examples/errAmbiguous'}
            errIdConflict: {$ref: '#/components/examples/errIdConflict'}
            errHopLimit: {$ref: '#/components/examples/errHopLimit'}
            errQueueFull: {$ref: '#/components/examples/errQueueFull'}
    TooLarge:
      description: The text is over `maxTextBytes`, or the body over the hub's 256 KiB cap.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errTooLarge: {$ref: '#/components/examples/errTooLarge'}
    UpgradeRequired:
      description: The daemon must be upgraded; it halts.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errProtocol: {$ref: '#/components/examples/errProtocol'}
            errUpgradeRequired: {$ref: '#/components/examples/errUpgradeRequired'}
    RateLimited:
      description: Wait `Retry-After` plus jitter; the outbox keeps the message.
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 0}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errRateLimited: {$ref: '#/components/examples/errRateLimited'}
    InternalError:
      description: Back off and retry forever; the outbox keeps every message.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errInternal: {$ref: '#/components/examples/errInternal'}
    Unavailable:
      description: Back off and retry forever.
      headers:
        Retry-After:
          required: false
          schema: {type: integer, minimum: 0}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
          examples:
            errUnavailable: {$ref: '#/components/examples/errUnavailable'}

  schemas:
    # ---------------------------------------------------------------- shared hub types
    Ms:
      description: Milliseconds since the Unix epoch.
      type: integer
      format: int64
      minimum: 0
    Uuid:
      description: A message or frame id, RFC 4122 text form, lower case (it becomes the native msg_id).
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    MachineId:
      description: '"pm_" + base64url (no padding) of the first 16 bytes of SHA-256(SPKI DER of the machine key) (*proposed*, contract.md section 4).'
      type: string
      pattern: '^pm_[A-Za-z0-9_-]{22}$'
    SessionKey:
      description: '<pid> + "-" + first 8 hex of SHA-256(procStart as the registry stores it) (*proposed*, contract.md section 6).'
      type: string
      pattern: '^[1-9][0-9]{0,9}-[0-9a-f]{8}$'
    EndpointId:
      description: Minted by the hub; also the envelope's from-session, so it fits that grammar.
      type: string
      pattern: '^pe_[A-Za-z0-9_-]{1,77}$'
    Label:
      description: A session or project label of an address (D13).
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,39}$'
    MachineName:
      description: The enrolled machine name.
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,15}$'
    Address:
      description: 'A peer address as the hub assigns it (D13): an agent "atlas", or a session "name@project" or "name@project:machine".'
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,39}(@[a-z0-9][a-z0-9._-]{0,39}(:[a-z0-9][a-z0-9-]{0,15})?)?$'
    AddressInput:
      description: An address as a sender wrote it; the hub resolves it or refuses with bad_address, not_found or ambiguous.
      type: string
      minLength: 1
      maxLength: 100
    FromMode:
      description: The sending session's real permission class (R13).
      type: string
      x-amesh-open: false
      enum: [bypass, prompting]
    PeerStatus:
      type: string
      x-amesh-open: true
      enum: [idle, busy, offline]
    Kind:
      type: string
      x-amesh-open: true
      enum: [agent, session]
    Epoch:
      description: A connection epoch (contract.md section 5); it changes only when the daemon process holding it changes. Every write and the stream carry the live one; any other answers 409 superseded (A2).
      type: integer
      minimum: 1
    Instance:
      description: 16 random bytes, base64url without padding, minted once per daemon process (contract.md section 5).
      type: string
      pattern: '^[A-Za-z0-9_-]{22}$'
    LogId:
      description: The hub event log's id, minted with the log; a new log (another hub, a restored database) has a new id (contract.md section 10).
      type: string
      pattern: '^lg_[A-Za-z0-9_-]{8,64}$'
    Hop:
      type: object
      required: [count, limit]
      properties:
        count: {type: integer, minimum: 0, description: 'Messages delivered in this conversation since a human last took part, this one included when it is delivered; in a refusal or a limit event, the count reached, without the stopped message.'}
        limit: {type: integer, minimum: 1}
    HopChain:
      description: Claude Code's hop-chain tokens, carried unchanged end to end; never minted or read by amesh or the hub.
      type: array
      maxItems: 32
      items: {type: string, pattern: '^[0-9a-f]{24}$'}
    ErrorCode:
      description: 'Stable error codes; an open set, so an unknown code is handled by its status class (contract.md section 14).'
      type: string
      x-amesh-open: true
      enum:
        - bad_request
        - bad_body
        - empty_text
        - slash_command
        - bad_address
        - bad_cursor
        - bad_signature
        - unknown_machine
        - stale_timestamp
        - replayed
        - machine_revoked
        - not_member
        - not_a_party
        - not_found
        - not_running
        - unknown_session
        - unknown_endpoint
        - ambiguous
        - id_conflict
        - hop_limit
        - queue_full
        - machine_in_use
        - superseded
        - too_large
        - protocol
        - upgrade_required
        - rate_limited
        - internal
        - unavailable
    ErrorBody:
      description: Every hub error. `message` is written to be shown to Claude as it is; the daemon branches only on `error`.
      type: object
      required: [error, message]
      properties:
        error: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string}
        protocol: {type: integer}
        minProtocol: {type: integer}
        minAmesh: {type: string}
        serverTime: {$ref: '#/components/schemas/Ms'}
        retryAfter: {type: integer, minimum: 0, description: 'Seconds.'}
        maxBytes: {type: integer}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/Address'}
        hop: {$ref: '#/components/schemas/Hop'}
        epoch: {$ref: '#/components/schemas/Epoch'}
        seq: {type: integer, minimum: 0}

    # ---------------------------------------------------------------- hello
    HelloInfo:
      type: object
      required: [protocol, minProtocol, features, serverTime]
      properties:
        protocol: {type: integer, minimum: 1}
        minProtocol: {type: integer, minimum: 1}
        features:
          description: What the hub serves (open set) - agents, sessions, hop-limit, idle, later ones.
          type: array
          items: {type: string}
        serverTime: {$ref: '#/components/schemas/Ms'}
    HelloRequest:
      type: object
      required: [instance, resumeEpoch, takeover, amesh, claudeCode, capabilities]
      properties:
        instance: {$ref: '#/components/schemas/Instance', description: 'This daemon process; the hub tells a reconnect from a second daemon by it.'}
        resumeEpoch:
          description: The epoch this process already holds; null at process start. Logged by the hub, which decides by `instance`.
          oneOf:
            - {$ref: '#/components/schemas/Epoch'}
            - {type: 'null'}
        takeover: {type: boolean, description: 'True only on the first hello after the daemon process started.'}
        amesh:
          type: object
          required: [version, os, arch]
          properties:
            version: {type: string}
            os: {type: string}
            arch: {type: string}
        claudeCode:
          type: object
          required: [versions, peerProtocol, nativeCheck]
          properties:
            versions:
              description: Claude Code versions seen in the registry of registered sessions.
              type: array
              items: {type: string}
            peerProtocol: {type: integer, description: 'The registry''s peerProtocol the daemon checked (R24).'}
            nativeCheck: {type: string, const: ok, description: 'The daemon never connects with a failed startup check.'}
        capabilities:
          description: What the daemon does (open set) - receipts, idle, human-turn, later ones.
          type: array
          items: {type: string}
    Settings:
      description: |-
        Timing pushed by the hub (L13). The daemon validates the whole object against these
        bounds; on any violation or missing field it uses the defaults for all of them and logs
        one warning (*proposed* bounds).
      type: object
      required: [heartbeatMs, streamSilenceMs, backoffInitialMs, backoffMaxMs, backoffResetAfterMs, acceptWindowMs, requestTimeoutMs, sendWaitMs]
      properties:
        heartbeatMs: {type: integer, default: 20000, minimum: 5000, maximum: 30000, description: 'Heartbeat period (L10).'}
        streamSilenceMs: {type: integer, default: 45000, minimum: 20000, maximum: 120000, description: 'Reconnect after this long without stream bytes.'}
        backoffInitialMs: {type: integer, default: 500, minimum: 100, maximum: 5000}
        backoffMaxMs: {type: integer, default: 10000, minimum: 1000, maximum: 60000}
        backoffResetAfterMs: {type: integer, default: 5000, minimum: 1000, maximum: 60000, description: 'Connected time that resets the backoff.'}
        acceptWindowMs: {type: integer, default: 8000, minimum: 1000, maximum: 30000, description: 'Silence after an inbox write that means accepted (D25); above the 5 s after which Claude Code sends coalesced drop receipts (A1).'}
        requestTimeoutMs: {type: integer, default: 10000, minimum: 2000, maximum: 60000}
        sendWaitMs: {type: integer, default: 5000, minimum: 0, maximum: 15000, description: 'How long send_message waits for the hub''s answer.'}
    Limits:
      description: The hub's limits, informational for the daemon except maxTextBytes, which it checks before sending (32768 when missing or invalid). The outbox TTL and the delivered-id record's retention are built into the daemon at 24 h (N3), never read from queueTtlMs (A2).
      type: object
      required: [maxTextBytes, hopLimit, queueTtlMs, offlineQueueMax, machineRate, keepaliveMs, offlineAfterMs]
      properties:
        maxTextBytes: {type: integer, default: 32768, description: 'R10 (D42).'}
        hopLimit: {type: integer, default: 20, description: 'D20.'}
        queueTtlMs: {type: integer, default: 86400000, description: 'D19.'}
        offlineQueueMax: {type: integer, default: 100, description: 'Per target session (*proposed*).'}
        machineRate:
          description: R21 (D42); messages only, refused sends included.
          type: object
          required: [limit, windowMs]
          properties:
            limit: {type: integer, default: 60}
            windowMs: {type: integer, default: 600000}
        keepaliveMs: {type: integer, default: 15000, description: 'L10.'}
        offlineAfterMs: {type: integer, default: 60000, description: 'L10.'}
    HelloResponse:
      type: object
      required: [protocol, minProtocol, machine, epoch, log, features, settings, limits, serverTime]
      properties:
        protocol: {type: integer}
        minProtocol: {type: integer}
        machine:
          type: object
          required: [id, name]
          properties:
            id: {$ref: '#/components/schemas/MachineId'}
            name: {$ref: '#/components/schemas/MachineName', description: 'The name set at enrollment is authoritative.'}
        epoch: {$ref: '#/components/schemas/Epoch'}
        log: {$ref: '#/components/schemas/LogId', description: 'The daemon keys its cursor and outbox on it and starts both from 0 when it changes; the delivered-id record is kept (A2).'}
        features:
          type: array
          items: {type: string}
        settings: {$ref: '#/components/schemas/Settings'}
        limits: {$ref: '#/components/schemas/Limits'}
        serverTime: {$ref: '#/components/schemas/Ms'}

    # ---------------------------------------------------------------- sessions
    SessionRegisterRequest:
      type: object
      required: [epoch, sessionId, name, nameSource, project, status, entrypoint, claudeCode, startedAt]
      properties:
        epoch: {$ref: '#/components/schemas/Epoch'}
        sessionId: {type: string, description: "Claude Code's session id, an attribute (it changes on /clear)."}
        name: {type: string, description: "The registry's name, before address normalisation."}
        nameSource: {type: string, description: 'user or derived (open set).'}
        project: {type: string, description: 'The project name (contract.md section 7).'}
        status: {type: string, enum: [idle, busy], x-amesh-open: false, description: "The registry's status at registration; waiting and others map to busy. Later changes travel in the heartbeat (A2)."}
        entrypoint: {type: string, description: 'cli or sdk-cli (open set).'}
        claudeCode: {type: string, description: "The session's Claude Code version."}
        startedAt: {$ref: '#/components/schemas/Ms'}
    SessionInfo:
      type: object
      required: [key, address, name, project, machine, status, registeredAt]
      properties:
        key: {$ref: '#/components/schemas/SessionKey'}
        address: {$ref: '#/components/schemas/Address', description: 'Assigned by the hub, suffixed on a collision (D13).'}
        name: {type: string}
        project: {type: string}
        machine: {$ref: '#/components/schemas/MachineName'}
        status:
          type: string
          enum: [idle, busy, offline, ended]
          x-amesh-open: true
        registeredAt: {$ref: '#/components/schemas/Ms'}
    SessionRegisterResponse:
      type: object
      required: [session]
      properties:
        session: {$ref: '#/components/schemas/SessionInfo'}
    HeartbeatRequest:
      type: object
      required: [epoch, cursor, sessions]
      properties:
        epoch: {$ref: '#/components/schemas/Epoch'}
        cursor: {type: integer, minimum: 0, description: 'The persisted low-water mark (D39): every log event at or below it is fully handled; events above it may be too. Sets sent up to it.'}
        sessions:
          description: Every registered session of this machine, complete.
          type: array
          items:
            type: object
            required: [key, status]
            properties:
              key: {$ref: '#/components/schemas/SessionKey'}
              status: {type: string, enum: [idle, busy], x-amesh-open: false}
    HeartbeatResponse:
      type: object
      required: [unknown, ended, serverTime]
      properties:
        unknown:
          description: Listed but not registered at the hub; the daemon registers them again.
          type: array
          items: {$ref: '#/components/schemas/SessionKey'}
        ended:
          description: Registered at the hub but missing from the list; the hub ended them (reason missing).
          type: array
          items: {$ref: '#/components/schemas/SessionKey'}
        serverTime: {$ref: '#/components/schemas/Ms'}
    HumanTurnRequest:
      type: object
      required: [epoch, at, source]
      properties:
        epoch: {$ref: '#/components/schemas/Epoch'}
        at: {$ref: '#/components/schemas/Ms'}
        source: {type: string, description: 'prompt; later sources are additive.'}
    HumanTurnResponse:
      type: object
      required: [reset]
      properties:
        reset: {type: integer, minimum: 0, description: 'Conversations whose counter went to 0.'}
    SessionEndRequest:
      type: object
      required: [epoch, reason]
      properties:
        epoch: {$ref: '#/components/schemas/Epoch'}
        reason: {type: string, enum: [exited, excluded, not_hosted], x-amesh-open: false}
    SessionEndResponse:
      type: object
      required: [session, dropped]
      properties:
        session:
          type: object
          required: [key, status]
          properties:
            key: {$ref: '#/components/schemas/SessionKey'}
            status: {type: string, const: ended}
        dropped: {type: integer, minimum: 0, description: 'Messages queued for it, now dropped with reason ended.'}

    # ---------------------------------------------------------------- directory
    Peer:
      type: object
      required: [address, kind, name, machine, project, status, lastSeen]
      properties:
        address: {$ref: '#/components/schemas/Address', description: 'What a send names in to.'}
        kind: {$ref: '#/components/schemas/Kind'}
        name: {type: string, description: "The agent's name, or the session part of the address."}
        machine:
          description: Null for agents.
          oneOf:
            - {$ref: '#/components/schemas/MachineName'}
            - {type: 'null'}
        project: {type: [string, 'null'], description: 'Null for agents.'}
        status: {$ref: '#/components/schemas/PeerStatus', description: 'An agent is busy while any of its containers runs a turn, else idle; never offline while the hub answers (*proposed*).'}
        lastSeen:
          oneOf:
            - {$ref: '#/components/schemas/Ms'}
            - {type: 'null'}
    PeersResponse:
      type: object
      required: [peers, serverTime]
      properties:
        peers:
          type: array
          items: {$ref: '#/components/schemas/Peer'}
        serverTime: {$ref: '#/components/schemas/Ms'}

    # ---------------------------------------------------------------- messages
    SendRequest:
      type: object
      required: [epoch, id, from, to, text, hopChain, fromMode, origin, notifyWhenIdle, failureNotice]
      properties:
        epoch: {$ref: '#/components/schemas/Epoch'}
        id: {$ref: '#/components/schemas/Uuid', description: 'Minted by the sender: a new UUID for an MCP send, the reply frame''s msg_id for a native reply.'}
        from:
          type: object
          required: [session]
          properties:
            session: {$ref: '#/components/schemas/SessionKey'}
        to:
          description: A start names an address; a native reply names the endpoint it answers.
          oneOf:
            - type: object
              required: [address]
              properties:
                address: {$ref: '#/components/schemas/AddressInput'}
            - type: object
              required: [endpoint]
              properties:
                endpoint: {$ref: '#/components/schemas/EndpointId'}
        text:
          description: At least one non-whitespace character, at most maxTextBytes UTF-8 bytes, never starting with "/" after leading whitespace (R10, R11).
          type: string
          minLength: 1
        hopChain: {$ref: '#/components/schemas/HopChain'}
        fromMode:
          description: "The sender's real class (R13): from the envelope for a native reply, else from the session's latest hook input; null asserts none."
          oneOf:
            - {$ref: '#/components/schemas/FromMode'}
            - {type: 'null'}
        origin:
          description: 'Recorded in the log only; it never resets the hop counter (contract.md section 9, A1).'
          type: string
          enum: [human, peer, unknown]
          x-amesh-open: false
        notifyWhenIdle: {type: boolean, description: 'Tell the sender when the target finishes the turn this message starts. Always false in v1: send_message has no notify_when_idle (A1).'}
        failureNotice: {type: boolean, description: 'Carried both ways so error chains stop after one (r-nanoclaw).'}
    EndpointRef:
      type: object
      required: [id, name, peer]
      properties:
        id: {$ref: '#/components/schemas/EndpointId'}
        name: {type: string, description: 'What the receiving session sees as from-name.'}
        peer: {$ref: '#/components/schemas/Address', description: 'The member behind it.'}
    SendResponse:
      type: object
      required: [message]
      properties:
        message:
          type: object
          required: [id, state, to, endpoint, hop, createdAt, expiresAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            state: {$ref: '#/components/schemas/DeliveryState', description: 'queued on first acceptance; the current state on a replay.'}
            to:
              type: object
              required: [address, kind, status]
              properties:
                address: {$ref: '#/components/schemas/Address'}
                kind: {$ref: '#/components/schemas/Kind'}
                status: {$ref: '#/components/schemas/PeerStatus'}
            endpoint: {$ref: '#/components/schemas/EndpointRef', description: 'Where replies to this conversation come from, on this machine.'}
            hop: {$ref: '#/components/schemas/Hop'}
            createdAt: {$ref: '#/components/schemas/Ms'}
            expiresAt: {$ref: '#/components/schemas/Ms', description: 'createdAt + queueTtlMs (D19).'}
    DeliveryState:
      description: |-
        queued (stored at the hub); sent (the receiving daemon's heartbeat cursor passed it, or any later report for it arrived, D39);
        accepted (written to the inbox, no negative receipt within acceptWindowMs; for an agent
        target, written into its hub session, A2; final); held (Claude Code holds it for
        approval); delivered, denied, expired (final, from a hold); refused (the session
        refuses peers; final); dropped (with a reason; final); unknown (written into the inbox and
        still open when the daemon restarted; final, never told, D25). Open set: an unknown state
        is logged and treated as not final.
      type: string
      x-amesh-open: true
      enum: [queued, sent, accepted, held, delivered, denied, expired, refused, dropped, unknown]
    DropReason:
      description: |-
        Claude Code's guard (rate-limited, queue-full: retried after pacing, then dropped;
        duplicate, hop-loop, hop-runaway: never retried); oversized (over the native line
        limit, refused before writing); session_gone (the inbox no longer accepts);
        unknown_session (the daemon does not host that key, L18); queue_expired (past
        queueTtlMs, D19); ended (the target ended with it queued); interrupted (the daemon
        restarted between recording the id and finishing the inbox write, so it may or may not
        have arrived; A1); route_failed (the hub could not write it into the agent's hub
        session; A1). Open set.
      type: string
      x-amesh-open: true
      enum: [rate-limited, queue-full, duplicate, hop-loop, hop-runaway, oversized, session_gone, unknown_session, queue_expired, ended, interrupted, route_failed]
    StateReport:
      type: object
      required: [kind, id, session, state, reason, at]
      properties:
        kind: {type: string, const: state}
        id: {$ref: '#/components/schemas/Uuid'}
        session: {$ref: '#/components/schemas/SessionKey', description: 'The receiving session; a report for a message routed elsewhere is not applied (A2).'}
        state:
          type: string
          enum: [accepted, held, delivered, denied, expired, refused, dropped, unknown]
          x-amesh-open: false
        reason:
          oneOf:
            - {$ref: '#/components/schemas/DropReason'}
            - {type: 'null'}
        at: {$ref: '#/components/schemas/Ms'}
    IdleReport:
      description: The turn the message started has ended.
      type: object
      required: [kind, id, session, at]
      properties:
        kind: {type: string, const: idle}
        id: {$ref: '#/components/schemas/Uuid'}
        session: {$ref: '#/components/schemas/SessionKey'}
        at: {$ref: '#/components/schemas/Ms'}
    Report:
      oneOf:
        - {$ref: '#/components/schemas/StateReport'}
        - {$ref: '#/components/schemas/IdleReport'}
      discriminator:
        propertyName: kind
        mapping:
          state: '#/components/schemas/StateReport'
          idle: '#/components/schemas/IdleReport'
    ReportsRequest:
      type: object
      required: [epoch, reports]
      properties:
        epoch: {$ref: '#/components/schemas/Epoch'}
        reports:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/Report'}
    ReportsResponse:
      type: object
      required: [results]
      properties:
        results:
          description: One per report, in order.
          type: array
          items:
            type: object
            required: [id, state, applied]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              state:
                description: The message's state after the report; null for an id the hub does not know or a message not routed to this machine and session.
                oneOf:
                  - {$ref: '#/components/schemas/DeliveryState'}
                  - {type: 'null'}
              applied: {type: boolean, description: 'False when the message was already final, the id is unknown, or the message was not routed to the signing machine and this session (then state is null; A2).'}

    # ---------------------------------------------------------------- events
    EndpointEvent:
      description: An endpoint this machine's sessions see messages from; announced as a log event before the first message that uses it, and again without an SSE id at every connect while it is open and lists a live key (the snapshot, contract.md section 10).
      type: object
      required: [kind, seq, id, name, peer, context, sessions, state, createdAt, closedAt]
      properties:
        kind: {type: string, const: endpoint}
        seq: {type: integer, minimum: 1}
        id: {$ref: '#/components/schemas/EndpointId'}
        name: {type: string}
        peer:
          type: object
          required: [address, kind]
          properties:
            address: {$ref: '#/components/schemas/Address'}
            kind: {$ref: '#/components/schemas/Kind'}
        context: {type: [string, 'null'], description: "The hub session's channel for an agent (peer, telegram, app); null for a session."}
        sessions:
          description: "This machine's non-ended sessions that are party to it; the endpoint closes when the last one ends (A2)."
          type: array
          items: {$ref: '#/components/schemas/SessionKey'}
        state: {type: string, enum: [open, closed], x-amesh-open: true}
        createdAt: {$ref: '#/components/schemas/Ms'}
        closedAt:
          oneOf:
            - {$ref: '#/components/schemas/Ms'}
            - {type: 'null'}
    MessageEvent:
      type: object
      required: [kind, seq, id, session, endpoint, text, hopChain, fromMode, hop, notifyWhenIdle, failureNotice, createdAt, expiresAt]
      properties:
        kind: {type: string, const: message}
        seq: {type: integer, minimum: 1}
        id: {$ref: '#/components/schemas/Uuid', description: 'Becomes the native msg_id.'}
        session: {$ref: '#/components/schemas/SessionKey', description: 'The receiving session on this machine.'}
        endpoint: {$ref: '#/components/schemas/EndpointRef', description: 'from-session, from-name and the relay socket.'}
        text: {type: string, minLength: 1}
        hopChain: {$ref: '#/components/schemas/HopChain'}
        fromMode:
          description: "The sender's real class; null asserts none. Agents: bypass if nanoclaw's runner runs without prompts, else null (a build check in container/agent-runner)."
          oneOf:
            - {$ref: '#/components/schemas/FromMode'}
            - {type: 'null'}
        hop: {$ref: '#/components/schemas/Hop'}
        notifyWhenIdle: {type: boolean}
        failureNotice: {type: boolean}
        createdAt: {$ref: '#/components/schemas/Ms'}
        expiresAt: {$ref: '#/components/schemas/Ms'}
    DeliveryEvent:
      description: A state change of a message this machine sent.
      type: object
      required: [kind, seq, id, session, to, state, reason, message, at]
      properties:
        kind: {type: string, const: delivery}
        seq: {type: integer, minimum: 1}
        id: {$ref: '#/components/schemas/Uuid'}
        session: {$ref: '#/components/schemas/SessionKey', description: 'The sender.'}
        to:
          type: object
          required: [address, endpoint]
          properties:
            address: {$ref: '#/components/schemas/Address'}
            endpoint: {$ref: '#/components/schemas/EndpointId'}
        state: {$ref: '#/components/schemas/DeliveryState'}
        reason:
          description: A DropReason or a refusal code (unknown_session is in both sets, so anyOf; A2).
          anyOf:
            - {$ref: '#/components/schemas/DropReason'}
            - {$ref: '#/components/schemas/ErrorCode'}
            - {type: 'null'}
        message: {type: string, description: 'Display text for the notice.'}
        at: {$ref: '#/components/schemas/Ms'}
    LimitEvent:
      description: A conversation reached the hop limit (D20).
      type: object
      required: [kind, seq, session, endpoint, hop, stopped, message, at]
      properties:
        kind: {type: string, const: limit}
        seq: {type: integer, minimum: 1}
        session: {$ref: '#/components/schemas/SessionKey'}
        endpoint: {$ref: '#/components/schemas/EndpointRef'}
        hop: {$ref: '#/components/schemas/Hop'}
        stopped:
          description: The message that was not delivered.
          type: object
          required: [id, direction]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            direction: {type: string, enum: [in, out], x-amesh-open: true}
        message: {type: string}
        at: {$ref: '#/components/schemas/Ms'}
    IdleEvent:
      description: The turn a notifyWhenIdle message started has ended.
      type: object
      required: [kind, seq, id, session, peer, at]
      properties:
        kind: {type: string, const: idle}
        seq: {type: integer, minimum: 1}
        id: {$ref: '#/components/schemas/Uuid', description: 'The message that asked.'}
        session: {$ref: '#/components/schemas/SessionKey', description: 'Its sender.'}
        peer: {$ref: '#/components/schemas/Address'}
        at: {$ref: '#/components/schemas/Ms'}
    StatusEvent:
      description: A directory entry changed; listed false means it left. Not a log event.
      type: object
      required: [kind, peer, listed]
      properties:
        kind: {type: string, const: status}
        peer: {$ref: '#/components/schemas/Peer'}
        listed: {type: boolean}
    SynchronizedEvent:
      description: The replay is complete up to the log head seq. Counts as a handled event at its seq, so the low-water mark reaches that seq once every event below it is handled (D39).
      type: object
      required: [kind, seq]
      properties:
        kind: {type: string, const: synchronized}
        seq: {type: integer, minimum: 0}
    RevokedEvent:
      description: Sent, then the stream closes; every later request is 403 machine_revoked.
      type: object
      required: [kind, machine, message, at]
      properties:
        kind: {type: string, const: revoked}
        machine: {$ref: '#/components/schemas/MachineId'}
        message: {type: string}
        at: {$ref: '#/components/schemas/Ms'}
    SupersededEvent:
      description: Sent, then the stream closes; every later request is 409 superseded.
      type: object
      required: [kind, epoch, by, message, at]
      properties:
        kind: {type: string, const: superseded}
        epoch: {$ref: '#/components/schemas/Epoch'}
        by: {$ref: '#/components/schemas/Epoch'}
        message: {type: string}
        at: {$ref: '#/components/schemas/Ms'}
    PeerEvent:
      description: |-
        Every event kind, discriminated by `kind`, which equals the SSE `event` field. Open
        set: an event of an unknown kind is logged and ignored; with an SSE id it counts as
        handled on receipt for the low-water mark.
      oneOf:
        - {$ref: '#/components/schemas/EndpointEvent'}
        - {$ref: '#/components/schemas/MessageEvent'}
        - {$ref: '#/components/schemas/DeliveryEvent'}
        - {$ref: '#/components/schemas/LimitEvent'}
        - {$ref: '#/components/schemas/IdleEvent'}
        - {$ref: '#/components/schemas/StatusEvent'}
        - {$ref: '#/components/schemas/SynchronizedEvent'}
        - {$ref: '#/components/schemas/RevokedEvent'}
        - {$ref: '#/components/schemas/SupersededEvent'}
      discriminator:
        propertyName: kind
        mapping:
          endpoint: '#/components/schemas/EndpointEvent'
          message: '#/components/schemas/MessageEvent'
          delivery: '#/components/schemas/DeliveryEvent'
          limit: '#/components/schemas/LimitEvent'
          idle: '#/components/schemas/IdleEvent'
          status: '#/components/schemas/StatusEvent'
          synchronized: '#/components/schemas/SynchronizedEvent'
          revoked: '#/components/schemas/RevokedEvent'
          superseded: '#/components/schemas/SupersededEvent'
    EventStreamItem:
      description: |-
        One SSE event of `GET /peer/events`. `data` is one line of JSON, a `PeerEvent` whose
        `kind` equals `event`. Log events (endpoint, message, delivery, limit, idle) carry `id`
        equal to their `seq` and are eligible for the low-water mark once handled; status,
        synchronized, revoked, superseded and the endpoint snapshot at connect carry no `id`.
      type: object
      required: [event, data]
      properties:
        event: {type: string}
        data:
          type: string
          contentMediaType: application/json
          contentSchema: {$ref: '#/components/schemas/PeerEvent'}
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        retry: {type: integer}
      oneOf:
        - required: [event, id]
          properties:
            event: {enum: [endpoint, message, delivery, limit, idle], x-amesh-open: false}
        - required: [event]
          properties:
            event: {enum: [endpoint, status, synchronized, revoked, superseded], x-amesh-open: false}
            id: false

    # ---------------------------------------------------------------- native frames (Claude Code)
    NativeUserFrame:
      description: |-
        A message into a session's inbox socket, one NDJSON line per connection: a delivery
        (from a message event), a daemon notice, a lane frame, or a native reply read on a relay
        socket. `content` is the canonical envelope (contract.md section 15). Only a notice with
        no conversation relay (a start the hub refused after the tool answered) has no `from`,
        in the frame and in the envelope. The inbox writer appends two LF characters and one reply
        line before the closing tag. For a delivery from the hub it names the peer's address and the
        conversation's endpoint id:
        (amesh: <name> cannot see what you write here. To answer, call send_message with to="<address>" and reply_to="<endpoint id>".)
        For a send between two sessions of one machine it names only the address:
        (amesh: <name> cannot see what you write here. To answer, call send_message with to="<address>".)
        A sender with no assigned address gets the native line, SendMessage with the frame's exact
        from address. send_message with reply_to is sent to that endpoint exactly as a native reply
        on its relay socket would be; an unknown reply_to is ignored and the message goes to the
        address. Lane and notice rules follow contract.md section 15.
      x-amesh-native: true
      externalDocs: {description: 's-native.md: exact frame and envelope formats', url: './s-native.md#exact-frame-and-envelope-formats-that-worked'}
      type: object
      required: [type, message, priority, msgV, msg_id]
      properties:
        type: {type: string, const: user}
        message:
          type: object
          required: [role, content]
          properties:
            role: {type: string, const: user}
            content:
              type: string
              pattern: '^<cross-session-message( [^>]*)?>\n[\s\S]*\n</cross-session-message>$'
        priority: {type: string, const: next}
        from: {$ref: '#/components/schemas/NativeAddress', description: 'Equal to the envelope''s from; absent only when the envelope has none.'}
        msgV: {type: integer, const: 1}
        msg_id: {$ref: '#/components/schemas/Uuid', description: 'The hub message id (D25), the replier''s own id, a notice id derived from its cause (contract.md section 15) or a random lane-frame id.'}
    NativeAddress:
      description: '"uds:" + a socket path, characters outside [A-Za-z0-9:_/.-] percent-encoded, at most 300 characters.'
      x-amesh-native: true
      type: string
      maxLength: 300
      pattern: '^uds:[A-Za-z0-9%:_/.-]+$'
    NativeNotifyWhenIdle:
      description: Asks the receiving session to answer with peer_idle_notice when the turn ends; sent from the same relay socket after the message. In v1 only lane mode sends it, to the child each time its registry status turns busy, and the answer becomes laneTurnEndFrame (contract.md section 18, A2).
      x-amesh-native: true
      externalDocs: {description: 's-native.md: what a Go daemon must implement', url: './s-native.md#what-a-go-daemon-must-implement'}
      type: object
      required: [type, action, from, msg_id, msgV]
      properties:
        type: {type: string, const: control}
        action: {type: string, const: notify_when_idle}
        from: {$ref: '#/components/schemas/NativeAddress', description: 'The relay address the answer comes back to.'}
        msg_id: {$ref: '#/components/schemas/Uuid', description: 'The subscription id, echoed as orig_msg_id.'}
        msgV: {type: integer, const: 1}
        from_mode: {$ref: '#/components/schemas/FromMode', description: 'bypass for a bypass receiver; absent for a prompting receiver or one of unknown class (contract.md section 15).'}
    NativeReceipt:
      description: A receipt for a frame the daemon wrote, correlated by orig_msg_id; read on the relay socket that posted.
      x-amesh-native: true
      externalDocs: {description: 's-native.md: receipts', url: './s-native.md#receipts'}
      type: object
      required: [type, action, status, reason, from, orig_msg_id, msgV, msg_id]
      properties:
        type: {type: string, const: control}
        action: {type: string, const: peer_message_status}
        status: {type: string, enum: [held, delivered, denied, expired, dropped], x-amesh-open: true}
        status_detail: {type: string, enum: [refused], x-amesh-open: true}
        reason: {type: string, description: "Claude Code's sentence; logged, never parsed."}
        from: {$ref: '#/components/schemas/NativeAddress', description: "The receiving session's socket."}
        orig_msg_id: {$ref: '#/components/schemas/Uuid'}
        drop_reason: {type: string, enum: [rate-limited, queue-full, duplicate, hop-loop, hop-runaway], x-amesh-open: true}
        dropped_msg_ids:
          description: More ids a coalesced drop covers.
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
        msgV: {type: integer, const: 1}
        msg_id: {$ref: '#/components/schemas/Uuid'}
    NativeIdleNotice:
      description: The answer to notify_when_idle, correlated by orig_msg_id to the subscription.
      x-amesh-native: true
      externalDocs: {description: 's-native.md: receipts', url: './s-native.md#receipts'}
      type: object
      required: [type, action, orig_msg_id, state, finished_at, from, from_mode, msgV, msg_id]
      properties:
        type: {type: string, const: control}
        action: {type: string, const: peer_idle_notice}
        orig_msg_id: {$ref: '#/components/schemas/Uuid'}
        state: {type: string, const: idle}
        finished_at: {$ref: '#/components/schemas/Ms'}
        from: {$ref: '#/components/schemas/NativeAddress'}
        from_mode: {$ref: '#/components/schemas/FromMode'}
        msgV: {type: integer, const: 1}
        msg_id: {$ref: '#/components/schemas/Uuid'}
    HookInputUserPromptSubmit:
      description: "Claude Code's UserPromptSubmit hook input, as amesh hook forwards it (fields beyond these are ignored)."
      x-amesh-native: true
      externalDocs: {description: 's-edge.md: UserPromptSubmit as the hop-limit reset signal', url: './s-edge.md#q1---userpromptsubmit-as-the-hop-limit-reset-signal'}
      type: object
      required: [hook_event_name, session_id, prompt]
      properties:
        hook_event_name: {type: string, const: UserPromptSubmit}
        session_id: {type: string, description: 'A cross-check only; identity is the kernel peer pid.'}
        transcript_path: {type: string}
        cwd: {type: string}
        prompt_id: {type: string}
        permission_mode: {type: string}
        prompt: {type: string}
        session_title: {type: string}
    HookInputPreToolUse:
      description: "Claude Code's PreToolUse hook input. agent_id is present only inside a subagent (s-edge Q2)."
      x-amesh-native: true
      externalDocs: {description: 's-edge.md: keeping the amesh tools away from subagents', url: './s-edge.md#q2---keeping-the-amesh-tools-away-from-subagents'}
      type: object
      required: [hook_event_name, session_id, tool_name]
      properties:
        hook_event_name: {type: string, const: PreToolUse}
        session_id: {type: string}
        cwd: {type: string}
        permission_mode: {type: string}
        agent_id: {type: string}
        agent_type: {type: string}
        tool_name: {type: string}
        tool_input: {type: object}
        tool_use_id: {type: string}
    HookInput:
      oneOf:
        - {$ref: '#/components/schemas/HookInputUserPromptSubmit'}
        - {$ref: '#/components/schemas/HookInputPreToolUse'}
      discriminator:
        propertyName: hook_event_name
        mapping:
          UserPromptSubmit: '#/components/schemas/HookInputUserPromptSubmit'
          PreToolUse: '#/components/schemas/HookInputPreToolUse'
    HookOutputPreToolUse:
      description: The R15 deny, printed by amesh hook for a subagent's amesh tool call, or, in the M1 trial, for its native SendMessage to an amesh relay.
      x-amesh-native: true
      type: object
      required: [hookSpecificOutput]
      properties:
        hookSpecificOutput:
          type: object
          required: [hookEventName, permissionDecision, permissionDecisionReason]
          properties:
            hookEventName: {type: string, const: PreToolUse}
            permissionDecision: {type: string, const: deny}
            permissionDecisionReason: {type: string}
    NotHumanPromptPrefixes:
      description: A UserPromptSubmit prompt starting with any of these was not typed by a human (s-edge Q1); the daemon answers 204.
      type: array
      items: {type: string}

    # ---------------------------------------------------------------- daemon socket
    LocalError:
      type: object
      required: [error, message]
      properties:
        error:
          description: 'not_in_session: the walk found no live registry entry; excluded: a mesh pipe under AMESH_EXCLUDE or from a config dir other than the first in AMESH_CLAUDE_CONFIG_DIRS; bad_request.'
          type: string
          enum: [not_in_session, excluded, bad_request]
          x-amesh-open: true
        message: {type: string}
    DaemonStatus:
      type: object
      required: [daemon, machine, hub, configDirs, sessions, lanes, outbox, open]
      properties:
        daemon:
          type: object
          required: [version, pid, startedAt]
          properties:
            version: {type: string}
            pid: {type: integer}
            startedAt: {$ref: '#/components/schemas/Ms'}
        machine:
          description: Null before enrollment.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: {$ref: '#/components/schemas/MachineId'}
                name: {$ref: '#/components/schemas/MachineName'}
            - {type: 'null'}
        hub:
          type: object
          required: [state, since, epoch, cursor, halt]
          properties:
            state: {type: string, enum: [connected, connecting, halted], x-amesh-open: true}
            since: {$ref: '#/components/schemas/Ms'}
            epoch:
              oneOf:
                - {$ref: '#/components/schemas/Epoch'}
                - {type: 'null'}
            cursor: {type: integer, minimum: 0}
            halt:
              description: Why it halted (contract.md section 14).
              oneOf:
                - {$ref: '#/components/schemas/ErrorBody'}
                - {type: 'null'}
        configDirs:
          description: The Claude config dirs the daemon scans (AMESH_CLAUDE_CONFIG_DIRS) and the live registry entries in each.
          type: array
          items:
            type: object
            required: [path, sessions]
            properties:
              path: {type: string}
              sessions: {type: integer, minimum: 0}
        sessions:
          type: array
          items:
            type: object
            required: [key, address, status, role]
            properties:
              key: {$ref: '#/components/schemas/SessionKey'}
              address: {$ref: '#/components/schemas/Address'}
              status: {$ref: '#/components/schemas/PeerStatus'}
              role: {type: string, const: member}
        lanes:
          type: array
          items:
            type: object
            required: [id, relay, parent, child]
            properties:
              id: {$ref: '#/components/schemas/LaneId'}
              relay: {$ref: '#/components/schemas/NativeAddress'}
              parent:
                type: object
                required: [name, sessionId]
                properties:
                  name: {type: string}
                  sessionId: {type: string, description: 'The --parent argument the lane is keyed on.'}
              child:
                type: object
                required: [name, sessionId, configDir]
                properties:
                  name: {type: string}
                  sessionId: {type: string}
                  configDir: {type: string}
        outbox:
          type: object
          required: [count, oldestAt]
          properties:
            count: {type: integer, minimum: 0}
            oldestAt:
              oneOf:
                - {$ref: '#/components/schemas/Ms'}
                - {type: 'null'}
        open:
          description: Messages written whose final state is not known yet.
          type: object
          required: [count]
          properties:
            count: {type: integer, minimum: 0}
        warnings:
          description: Plain warnings, such as a registered session on a Claude Code version the end-to-end test has not passed on (R24).
          type: array
          items: {type: string}
    LaneId:
      description: '"ln_" + first 16 hex of SHA-256("amesh-ln-id" LF parent argument LF child sessionId) (*proposed*, contract.md section 18); also the lane frames'' from-session.'
      type: string
      pattern: '^ln_[0-9a-f]{16}$'

    # ---------------------------------------------------------------- MCP (published by the daemon)
    McpListPeersArguments:
      type: object
      properties:
        filter:
          type: string
          description: 'Optional: "@project" or "@project:machine" to list only that project''s sessions.'
          pattern: '^@[a-z0-9][a-z0-9._-]{0,39}(:[a-z0-9][a-z0-9-]{0,15})?$'
      additionalProperties: false
    McpSendMessageArguments:
      type: object
      properties:
        to: {type: string, description: 'Peer address from list_peers or from the reply line of a peer message.', minLength: 1, maxLength: 100}
        message: {type: string, description: 'Plain text, at most 32 KiB.', minLength: 1}
        reply_to: {type: string, description: 'Only when answering a peer message: the reply_to value from its final amesh line. Keeps the answer in that conversation.', maxLength: 80}
      required: [to, message]
      additionalProperties: false
    McpSendToParentArguments:
      type: object
      properties:
        message: {type: string, description: 'Plain text, at most 32 KiB.', minLength: 1}
      required: [message]
      additionalProperties: false
    McpListPeersResult:
      description: Hub agents and remote sessions from the hub directory, plus other live local mesh members with assigned addresses. The caller is omitted.
      type: object
      required: [you, peers]
      properties:
        you:
          type: object
          required: [name, project, machine]
          properties:
            name: {$ref: '#/components/schemas/Address'}
            project: {type: string}
            machine: {$ref: '#/components/schemas/MachineName'}
        peers:
          type: array
          items:
            type: object
            required: [name, kind, machine, project, status, last_seen]
            properties:
              name: {$ref: '#/components/schemas/Address', description: 'The address to pass as to.'}
              kind: {$ref: '#/components/schemas/Kind'}
              machine: {type: [string, 'null']}
              project: {type: [string, 'null']}
              status: {$ref: '#/components/schemas/PeerStatus'}
              last_seen:
                description: RFC 3339 UTC, readable for Claude (*proposed*).
                type: [string, 'null']
                pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
        stale:
          type: string
          description: Present when the hub is unreachable or the daemon halted. Hub statuses may be stale. Local sessions come from the registry.
    McpSendResult:
      description: send_message result. A refusal is an answer, not an error (isError false).
      type: object
      oneOf:
        - type: object
          required: [accepted, to, id, note]
          properties:
            accepted: {type: boolean, const: true}
            to: {$ref: '#/components/schemas/Address'}
            id: {$ref: '#/components/schemas/Uuid'}
            note: {type: string}
        - type: object
          required: [accepted, reason, known]
          properties:
            accepted: {type: boolean, const: false}
            reason: {type: string}
            known:
              description: Candidates, or the directory's addresses for not_found.
              type: array
              items: {$ref: '#/components/schemas/Address'}
    McpSendToParentResult:
      description: send_to_parent result.
      type: object
      oneOf:
        - type: object
          required: [accepted, to, id]
          properties:
            accepted: {type: boolean, const: true}
            to: {type: string, const: parent}
            id: {$ref: '#/components/schemas/Uuid'}
        - type: object
          required: [accepted, reason]
          properties:
            accepted: {type: boolean, const: false}
            reason: {type: string}
    McpCallToolResult:
      description: "The MCP CallToolResult the daemon returns: one text content holding the result's JSON, the same object as structuredContent, isError false (mirrored from the MCP spec)."
      type: object
      required: [content, structuredContent, isError]
      properties:
        content:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [type, text]
            properties:
              type: {type: string, const: text}
              text: {type: string}
        structuredContent: {type: object}
        isError: {type: boolean, const: false}

    # ---------------------------------------------------------------- test vectors
    TestKey:
      description: A throwaway P-256 key for contract tests only (the app contract's). It protects nothing.
      type: object
      required: [privateKeyPkcs8Pem, publicKeySpki]
      properties:
        note: {type: string}
        privateKeyPkcs8Pem: {type: string}
        publicKeySpki: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    MachineIdVector:
      type: object
      required: [rule, publicKeySpki, machineId]
      properties:
        rule: {type: string}
        publicKeySpki: {type: string}
        machineId: {$ref: '#/components/schemas/MachineId'}
    SessionKeyVector:
      type: object
      required: [rule, pid, procStart, sessionKey]
      properties:
        rule: {type: string}
        pid: {type: integer}
        procStart: {type: string}
        sessionKey: {$ref: '#/components/schemas/SessionKey'}
    RelaySocketVector:
      type: object
      required: [rule, machineId, endpointId, path, address]
      properties:
        rule: {type: string}
        machineId: {$ref: '#/components/schemas/MachineId'}
        endpointId: {$ref: '#/components/schemas/EndpointId'}
        path: {type: string, pattern: '^/tmp/cc-socks/a[0-9a-f]{15}\.sock$'}
        address: {$ref: '#/components/schemas/NativeAddress'}
    NoticeIdVector:
      description: A notice's msg_id, derived from what caused it, so a replayed event writes no second notice (contract.md section 15).
      type: object
      required: [rule, namespace, machineId, log, source, kind, msgId]
      properties:
        rule: {type: string}
        namespace: {$ref: '#/components/schemas/Uuid'}
        machineId: {$ref: '#/components/schemas/MachineId'}
        log: {$ref: '#/components/schemas/LogId', description: 'The hub log the cause came from (A2): event seqs repeat across logs.'}
        source: {type: string, description: 'The event seq in decimal, or the message id for an outbox notice.'}
        kind: {type: string, description: 'The event kind (delivery, limit, idle), or outbox (an outbox notice or a refused native reply).'}
        msgId: {$ref: '#/components/schemas/Uuid'}
    LaneSocketVector:
      type: object
      required: [rule, parentArgument, childSessionId, machineId, laneId, path]
      properties:
        rule: {type: string}
        parentArgument: {type: string}
        childSessionId: {type: string}
        machineId: {$ref: '#/components/schemas/MachineId'}
        laneId: {$ref: '#/components/schemas/LaneId'}
        path: {type: string, pattern: '^/tmp/cc-socks/a[0-9a-f]{15}\.sock$'}
    SignatureVector:
      description: A signed request; signatureValid says whether s verifies against testKey over canonical.
      type: object
      required: [name, protocol, method, target, body, ts, nonce, machineId, bodyHash, canonical, signature, authorization, signatureValid]
      properties:
        name: {type: string}
        protocol: {type: integer}
        method: {type: string, enum: [GET, POST, PUT], x-amesh-open: false}
        target: {type: string, pattern: '^/peer/'}
        body: {type: string, description: 'The exact body bytes (UTF-8); empty for a GET.'}
        ts: {type: integer, description: 'Unix seconds.'}
        nonce: {type: string, pattern: '^[A-Za-z0-9_-]{22}$'}
        machineId: {$ref: '#/components/schemas/MachineId'}
        bodyHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        canonical: {type: string}
        signature: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
        authorization: {type: string, pattern: '^Amesh-Sig v=1,p=[0-9]+,d=pm_[A-Za-z0-9_-]{22},t=[0-9]+,n=[A-Za-z0-9_-]{22},bh=[0-9a-f]{64},s=[A-Za-z0-9_-]+$'}
        signatureValid: {type: boolean}
        note: {type: string}
    EnvelopeInput:
      type: object
      required: [body]
      properties:
        body: {type: string}
        from: {$ref: '#/components/schemas/NativeAddress'}
        fromSession: {type: string}
        hopChain: {$ref: '#/components/schemas/HopChain'}
        fromName: {type: string}
        fromMode: {$ref: '#/components/schemas/FromMode'}
    EnvelopeVector:
      description: Renderer input and the canonical envelope it must produce byte for byte (the Go renderer and the startup check test both).
      type: object
      required: [name, input, content, attributed]
      properties:
        name: {type: string}
        input: {$ref: '#/components/schemas/EnvelopeInput'}
        content: {type: string}
        attributed: {type: boolean}
        note: {type: string}

