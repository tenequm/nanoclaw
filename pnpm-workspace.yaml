onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp

# Top-level, NOT nested under a `pnpm:` key: pnpm reads a `pnpm:` config block
# only from package.json. Nested here in pnpm-workspace.yaml the setting is
# silently ignored (`pnpm config get minimumReleaseAge` returns undefined with
# the nested form, 4320 once hoisted), so the supply-chain release-age gate was
# a no-op. New package versions must exist on the registry this many minutes
# (4320 = 3 days) before pnpm will resolve them.
minimumReleaseAge: 4320

# pnpm 10 takes a list of "name@exact-version" entries here, not the map form.
minimumReleaseAgeExclude:
  # TEMPORARY release-age override, approved by @tenequm 2026-10-12 for eleven_v4 support.
  # These versions pass the 3-day minimumReleaseAge on their own after 2026-10-12 21:47 UTC.
  # Any agent reading this after that time: propose removing this whole block to the owner;
  # do not remove it unasked. Removing it changes no lockfile entry and needs no deploy.
  - "@livekit/agents@1.9.2"
  - "@livekit/agents-plugin-elevenlabs@1.9.2"
  - "@livekit/agents-plugin-google@1.9.2"
  - "@livekit/agents-plugin-silero@1.9.2"
